<!DOCTYPE html>

<head>

<body>
    <h1>ELEMENTY LINIOWE</h1>
    <p>elementy liniowe to <span>span</span>, <em>em</em>, <strong>strong</strong> i <a href="#">link</a></p>

    <h1>ELEMENTY BLOKOWE</h1>
    <div class="red">1</div>
    <div class="green">2</div>
    <div class="yellow">3</div>

    <h1>display:inline-block</h1>

    <span class="inline-block">span</span><em class="inline-block">em</em><strong class="inline-block">strong</strong><a
        href="#" class="inline-block">link</a>

    <div class="blue inline-block">1</div>

    <div class="violet inline-block">2</div>

    <div class="brown inline-block">3</div>
