<meta name='viewport' content='width=device-width, initial-scale=1' />
<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Niemieckie 1 z 10</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #001f3f;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 15px;
            border: 2px solid #0074D9;
            box-shadow: 0 0 20px rgba(0, 116, 217, 0.5);
            max-width: 800px;
        }

        h1 {
            color: #FFDC00;
            font-size: 3rem;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        h2 {
            font-style: italic;
            color: #ddd;
            margin-bottom: 2rem;
        }

        .sound-board {
            display: flex;
            gap: 40px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .sound-card {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #555;
        }

        .sound-card p {
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .label{
            color: lightgoldenrodyellow;
        }

        .label-good {
            color: #2ECC40;
        }

        .label-bad {
            color: #FF4136;
        }

        footer {
            margin-top: 30px;
            font-size: 0.9rem;
            color: #aaa;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>1 von 10</h1>
        <h2>Das deutsche Quiz</h2>
        <hr style="width: 50%; border: 1px solid #0074D9; margin-bottom: 2rem;">

        <p>Panel sterowania dźwiękiem dla Komisji:</p>

        <div class="sound-board">

            <div class="sound-card">
                <p class="label">Intro </p>
                <iframe width="110" height="200" src="https://www.myinstants.com/instant/1z10-intro-23781/embed/"
                    frameborder="0" scrolling="no"></iframe>
            </div>

            <div class="sound-card">
                <p class="label-good">RICHTIG </p>
                <iframe width="110" height="200" src="https://www.myinstants.com/instant/1z10-prawidl-49832/embed/"
                    frameborder="0" scrolling="no"></iframe>
            </div>

            <div class="sound-card">
                <p class="label-bad">FALSCH </p>
                <iframe width="110" height="200" src="https://www.myinstants.com/instant/zla-odpowiedz-1-z-10-28115/embed/" 
                    frameborder="0" scrolling="no"></iframe>
            </div>

            <div class="sound-card">
                <p class="label">Utrata </p>
                <iframe width="110" height="200" src="https://www.myinstants.com/instant/1z10-utrata-3597/embed/"
                    frameborder="0" scrolling="no"></iframe>
            </div>
        </div>
<footer>
            Viel Glück wszystkim uczestnikom!
</footer>

</body>

</html>
