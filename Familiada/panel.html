<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>PANEL KONTROLNY - FAMILIADA</title>
    <style>
        body { font-family: sans-serif; background: #2c3e50; color: white; padding: 20px; margin: 0; }
        .container { max-width: 1300px; margin: 0 auto; display: grid; grid-template-columns: 2fr 1.2fr; gap: 20px; }
        .card { background: #34495e; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); margin-bottom: 20px; }
        h2 { margin-top: 0; border-bottom: 2px solid #16a085; padding-bottom: 10px; color: #1abc9c; }
        .btn { padding: 10px 15px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin: 3px; text-transform: uppercase; }
        .btn-green { background: #2ecc71; color: white; }
        .btn-red { background: #e74c3c; color: white; }
        .btn-blue { background: #3498db; color: white; }
        .btn-yellow { background: #f1c40f; color: black; }
        .btn:hover { opacity: 0.9; }
        .ans-row { display: flex; align-items: center; justify-content: space-between; background: #2c3e50; padding: 8px; margin: 5px 0; border-radius: 5px; }
        .q-select { width: 100%; padding: 10px; font-size: 1.1rem; margin-bottom: 15px; }
        .final-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .f-input { padding: 6px; width: 130px; }
        .f-pts { padding: 6px; width: 45px; text-align: center; }
        
        .soundboard {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            justify-items: center;
            background: #22313f;
            padding: 15px;
            border-radius: 8px;
        }
        .sound-block {
            text-align: center;
            background: #2c3e50;
            padding: 10px;
            border-radius: 8px;
            width: 120px;
            border: 2px solid #4f5d73;
        }
        .sound-block.error-zone {
            background: #7c251a;
            border-color: #e74c3c;
        }
        .soundboard iframe {
            border: none;
            border-radius: 10px;
            background: #fff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .quick-x-btn {
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 6px 0;
            width: 110px;
            margin-top: 8px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.8rem;
        }
        .quick-x-btn:hover { background: #c0392b; }
    </style>
</head>
<body>

    <h1 style="text-align:center; color:#1abc9c; margin-bottom:15px;">PANEL REŻYSERSKI FAMILIADY ZSI</h1>
    
    <div class="container">
        
        <!-- LEWA STRONA: ROZGRYWKA -->
        <div>
            <!-- Wybór trybu -->
            <div class="card" style="display: flex; justify-content: space-around; background: #1e2b37;">
                <button class="btn btn-blue" style="font-size:1.1rem;" onclick="setMode(false)">🎮 TRYB ZWYKŁY (RUNDY)</button>
                <button class="btn btn-yellow" style="font-size:1.1rem;" onclick="setMode(true)">🔥 TRYB FINAŁOWY</button>
            </div>

            <!-- RUNDY ZWYKŁE -->
            <div class="card" id="panel-normal">
                <h2>Rundy Główne</h2>
                <select class="q-select" id="questionSelect" onchange="loadQuestion()">
                    <option value="0">-- Wybierz pytanie --</option>
                    <option value="1">Pytanie 1: Co uczniowie robią, gdy komputer się zawiesi?</option>
                    <option value="2">Pytanie 2: Wymień najpopularniejsze zwierzę w IT.</option>
                    <option value="3">Pytanie 3: Ile myszek jest w naszej szkole?</option>
                    <option value="4">Pytanie 4: Co najczęściej mówi informatyk?</option>
                    <option value="5">Pytanie 5: Co najczęściej psuje się w komputerze?</option>
                    <option value="6">Pytanie 6: Jakie słowo najczęściej słyszy nauczyciel przedmiotów zawodowych?</option>
                </select>
                <h3 id="displayCurrentQ" style="color: #f1c40f;">Aktywne pytanie: Brak</h3>
                <div id="answersContainer"></div>
                
                <h3 style="margin-top:20px;">Manualna korekta punktów drużyn</h3>
                <button class="btn btn-blue" onclick="modifyScore(1, 10)">Nauczyciele +10</button>
                <button class="btn btn-red" onclick="modifyScore(1, -10)">Nauczyciele -10</button>
                |
                <button class="btn btn-blue" onclick="modifyScore(2, 10)">Programiści +10</button>
                <button class="btn btn-red" onclick="modifyScore(2, -10)">Programiści -10</button>
            </div>

            <!-- FINAŁ -->
            <div class="card" id="panel-final" style="display:none;">
                <h2>Stoper Finałowy</h2>
                <div style="margin-bottom: 15px;">
                    <button class="btn btn-green" onclick="startTimer(20)">⏱️ START GRACZ 1 (20s)</button>
                    <button class="btn btn-green" onclick="startTimer(25)">⏱️ START GRACZ 2 (25s)</button>
                    <button class="btn btn-red" onclick="stopTimer()">🛑 ZATRZYMAJ</button>
                </div>

                <h2>Odpowiedzi Finałowe</h2>
                <div class="final-grid">
                    <!-- GRACZ 1 -->
                    <div>
                        <h3 style="color:#3498db">Gracz 1</h3>
                        <div id="f-g1-rows"></div>
                    </div>
                    <!-- GRACZ 2 -->
                    <div>
                        <h3 style="color:#e67e22">Gracz 2</h3>
                        <div id="f-g2-rows"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- PRAWA STRONA: ORYGINALNE PRZYCISKI AUDIO Z MYINSTANTS -->
        <div>
            <div class="card">
                <h2>Oryginalny Soundboard</h2>
                
                <div class="soundboard">
                    <!-- PRZERYWNIK -->
                    <div class="sound-block">
                        <span style="font-size:0.8rem; display:block; margin-bottom:5px; font-weight:bold; color:#3498db;">1. Intro</span>
                        <iframe width="110" height="200" src="https://www.myinstants.com/instant/przerywnik-przed-i-po-familiada-83236/embed/" scrolling="no"></iframe>
                    </div>

                    <!-- DOBRA ODPOWIEDŹ -->
                    <div class="sound-block">
                        <span style="font-size:0.8rem; display:block; margin-bottom:5px; font-weight:bold; color:#2ecc71;">2. Trafienie</span>
                        <iframe width="110" height="200" src="https://www.myinstants.com/instant/dobra-odpowiedz-familiada-15351/embed/" scrolling="no"></iframe>
                    </div>

                    <!-- BŁĘDNA ODPOWIEDŹ + ZINTEGROWANE X -->
                    <div class="sound-block error-zone">
                        <span style="font-size:0.8rem; display:block; margin-bottom:5px; font-weight:bold; color:#ff9f91;">3. Błąd (X)</span>
                        <iframe width="110" height="200" src="https://www.myinstants.com/instant/bledna-familiada-78197/embed/" scrolling="no"></iframe>
                        <button class="quick-x-btn" onclick="triggerXOnly()">👉 WYŚWIETL X</button>
                    </div>

                    <!-- POWTÓRZENIE -->
                    <div class="sound-block">
                        <span style="font-size:0.8rem; display:block; margin-bottom:5px; font-weight:bold; color:#f1c40f;">4. Powtórka</span>
                        <iframe width="110" height="200" src="https://www.myinstants.com/instant/powtorzenie-w-finale-familiada-99989/embed/" scrolling="no"></iframe>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        const db = {
            1: { 
                q: "Co uczniowie robią, gdy komputer się zawiesi?", 
                a: [
                    {text: "Restartują", pts: 35},
                    {text: "Przeglądają Instagrama", pts: 25},
                    {text: "Klikają wszystko naraz", pts: 25},
                    {text: "Wołają nauczyciela", pts: 15}
                ] 
            },
            2: { 
                q: "Wymień najpopularniejsze zwierzę w IT.", 
                a: [
                    {text: "Myszka", pts: 45},
                    {text: "Python", pts: 25},
                    {text: "Bug (Robak)", pts: 15},
                    {text: "Pingwin", pts: 10},
                ] 
            },
            3: { 
                q: "Ile klawiatur jest w naszej szkole?", 
                a: [
                    {text: "Bardzo dużo", pts: 40},
                    {text: "Ponad 100", pts: 25},
                    {text: "Nikt nie wie", pts: 20},
                    {text: "Za mało", pts: 15}
                ] 
            },
            4: { 
                q: "Co najczęściej mówi informatyk?", 
                a: [
                    {text: "„Zrestartuj komputer”", pts: 40},
                    {text: "„A próbowałeś wyłączyć i włączyć?”", pts: 30},
                    {text: "„To nie u mnie działa źle”", pts: 20},
                    {text: "„Pokaż, co kliknąłeś”", pts: 10}
                ] 
            },
            5: { 
                q: "Co najczęściej psuje się w komputerze?", 
                a: [
                    {text: "System operacyjny", pts: 35},
                    {text: "Dysk", pts: 25},
                    {text: "Zasilacz", pts: 20},
                    {text: "Pamięć RAM", pts: 20}
                ] 
            },
            6: { 
                q: "Co najczęściej słyszy nauczyciel przedmiotów zawodowych?", 
                a: [
                    {text: "„Nie działa”", pts: 45},
                    {text: "„Pomocy!”", pts: 25},
                    {text: "„Wrzuci Pan/Pani kod na uczniowski”", pts: 20},
                    {text: "„Luz”", pts: 10}
                ] 
            }
        };

        let state = {
            isFinal: false,
            currentQuestion: "Oczekiwanie na pytanie...",
            score1: 0, score2: 0,
            answers: [],
            triggerX: false,
            timerRunning: false, timeLeft: 20,
            finalData: {
                g1: Array(5).fill({text:"", pts:0, showAns:false, showPts:false}),
                g2: Array(5).fill({text:"", pts:0, showAns:false, showPts:false})
            }
        };

        let timerInterval;

        function triggerXOnly() {
            state.triggerX = true;
            updateState();
            setTimeout(() => { state.triggerX = false; updateState(); }, 100);
        }

        function setMode(isFinal) {
            state.isFinal = isFinal;
            document.getElementById('panel-normal').style.display = isFinal ? 'none' : 'block';
            document.getElementById('panel-final').style.display = isFinal ? 'block' : 'none';
            updateState();
        }

        function loadQuestion() {
            const id = document.getElementById('questionSelect').value;
            if(id == 0) return;
            state.currentQuestion = db[id].q;
            document.getElementById('displayCurrentQ').innerText = "Aktywne pytanie: " + db[id].q;
            state.answers = db[id].a.map(ans => ({ ...ans, revealed: false }));
            renderPanelAnswers();
            updateState();
        }

        function renderPanelAnswers() {
            const container = document.getElementById('answersContainer');
            container.innerHTML = "";
            state.answers.forEach((ans, idx) => {
                const row = document.createElement('div');
                row.className = 'ans-row';
                row.innerHTML = `
                    <span><strong>${idx+1}.</strong> ${ans.text} (${ans.pts} pkt)</span>
                    <button class="btn btn-green" id="btn-ans-${idx}" onclick="revealAnswer(${idx})">ODSŁOŃ</button>
                `;
                container.appendChild(row);
            });
        }

        function revealAnswer(idx) {
            state.answers[idx].revealed = true;
            document.getElementById(`btn-ans-${idx}`).disabled = true;
            document.getElementById(`btn-ans-${idx}`).style.background = '#7f8c8d';
            updateState();
        }

        function modifyScore(team, val) {
            if(team===1) state.score1 = Math.max(0, parseInt(state.score1) + val);
            if(team===2) state.score2 = Math.max(0, parseInt(state.score2) + val);
            updateState();
        }

        function buildFinalPanel() {
            for(let g=1; g<=2; g++) {
                const container = document.getElementById(`f-g${g}-rows`);
                container.innerHTML = "";
                for(let p=0; p<5; p++) {
                    const div = document.createElement('div');
                    div.style.marginBottom = "8px";
                    div.innerHTML = `
                        <input type="text" placeholder="Odp ${p+1}" class="f-input" id="f-text-${g}-${p}" onchange="saveFinalData()">
                        <input type="number" placeholder="Pkt" class="f-pts" id="f-pts-${g}-${p}" onchange="saveFinalData()">
                        <button class="btn btn-blue" style="padding:4px 6px;" onclick="revealFinalField(${g}, ${p}, 'Ans')">Odp</button>
                        <button class="btn btn-green" style="padding:4px 8px;" onclick="revealFinalField(${g}, ${p}, 'Pts')">Pkt</button>
                    `;
                    container.appendChild(div);
                }
            }
        }

        function saveFinalData() {
            for(let g=1; g<=2; g++) {
                for(let p=0; p<5; p++) {
                    state.finalData[`g${g}`][p] = {
                        text: document.getElementById(`f-text-${g}-${p}`).value,
                        pts: document.getElementById(`f-pts-${g}-${p}`).value || 0,
                        showAns: state.finalData[`g${g}`][p].showAns,
                        showPts: state.finalData[`g${g}`][p].showPts
                    };
                }
            }
            updateState();
        }

        function revealFinalField(g, p, type) {
            if(type === 'Ans') state.finalData[`g${g}`][p].showAns = true;
            if(type === 'Pts') state.finalData[`g${g}`][p].showPts = true;
            updateState();
        }

        function startTimer(seconds) {
            clearInterval(timerInterval);
            state.timerRunning = true;
            state.timeLeft = seconds;
            updateState();
            
            timerInterval = setInterval(() => {
                state.timeLeft--;
                if(state.timeLeft <= 0) {
                    clearInterval(timerInterval);
                    state.timerRunning = false;
                }
                updateState();
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            state.timerRunning = false;
            updateState();
        }

        function updateState() {
            localStorage.setItem('familiada_state', JSON.stringify(state));
        }

        localStorage.removeItem('familiada_state');
        buildFinalPanel();
    </script>
</body>
</html>
