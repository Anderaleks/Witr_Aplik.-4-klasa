<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <title>PANEL KONTROLNY - FAMILIADA</title>
    <style>
        body {
            font-family: sans-serif;
            background: #2c3e50;
            color: white;
            padding: 20px;
            margin: 0;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 2fr 1.2fr;
            gap: 20px;
        }

        .card {
            background: #34495e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }

        h2 {
            margin-top: 0;
            border-bottom: 2px solid #16a085;
            padding-bottom: 10px;
            color: #1abc9c;
        }

        .btn {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin: 3px;
            text-transform: uppercase;
        }

        .btn-green {
            background: #2ecc71;
            color: white;
        }

        .btn-red {
            background: #e74c3c;
            color: white;
        }

        .btn-blue {
            background: #3498db;
            color: white;
        }

        .btn-yellow {
            background: #f1c40f;
            color: black;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .ans-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #2c3e50;
            padding: 8px;
            margin: 5px 0;
            border-radius: 5px;
        }

        .q-select {
            width: 100%;
            padding: 10px;
            font-size: 1.1rem;
            margin-bottom: 15px;
        }

        .final-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .f-input {
            padding: 6px;
            width: 130px;
        }

        .f-pts {
            padding: 6px;
            width: 55px;
            text-align: center;
        }

        .soundboard {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            justify-items: center;
            background: #22313f;
            padding: 15px;
            border-radius: 8px;
        }

        .sound-block {
            text-align: center;
            background: #2c3e50;
            padding: 10px;
            border-radius: 8px;
            width: 120px;
            border: 2px solid #4f5d73;
        }

        .sound-block.error-zone {
            background: #7c251a;
            border-color: #e74c3c;
        }

        .soundboard iframe {
            border: none;
            border-radius: 10px;
            background: #fff;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        .team-controls-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 15px;
        }

        .team-box-ctrl {
            background: #2c3e50;
            padding: 12px;
            border-radius: 8px;
            border-left: 5px solid #3498db;
        }

        .team-box-ctrl.red-side {
            border-left: 5px solid #e74c3c;
        }

        .strike-indicator {
            font-size: 1.5rem;
            letter-spacing: 5px;
            font-weight: bold;
            margin: 5px 0;
            color: #7f8c8d;
        }

        .strike-indicator span.active {
            color: #e74c3c;
            text-shadow: 0 0 5px #e74c3c;
        }
    </style>
</head>

<body>

    <h1 style="text-align:center; color:#1abc9c; margin-bottom:15px;">PANEL REŻYSERSKI FAMILIADY ZSI</h1>

    <div class="container">

        <div>
            <div class="card" style="display: flex; justify-content: space-around; background: #1e2b37;">
                <button class="btn btn-blue" style="font-size:1.1rem;" onclick="setMode(false)">🎮 TRYB ZWYKŁY
                    (RUNDY)</button>
                <button class="btn btn-yellow" style="font-size:1.1rem;" onclick="setMode(true)">🔥 TRYB
                    FINAŁOWY</button>
            </div>

            <div class="card" id="panel-normal">
                <h2>Rundy Główne</h2>
                <select class="q-select" id="questionSelect" onchange="loadQuestion()">
                    <option value="0">-- Wybierz pytanie --</option>
                    <option value="1">Pytanie 1: Co uczniowie robią, gdy komputer się zawiesi?</option>
                    <option value="2">Pytanie 2: Wymień najpopularniejsze zwierzę w IT.</option>
                    <option value="3">Pytanie 3: Ile myszek jest w naszej szkole?</option>
                    <option value="4">Pytanie 4: Co najczęściej mówi informatyk?</option>
                    <option value="5">Pytanie 5: Co najczęściej psuje się w komputerze?</option>
                    <option value="6">Pytanie 6: Jakie słowo najczęściej słyszy nauczyciel?</option>
                    <option value="7">Pytanie 7: Wymień popularny język programowania.</option>
                    <option value="8">Pytanie 8: Co oprócz komputera znajduje się na biurku?</option>
                    <option value="9">Pytanie 9: Jaka jest najpopularniejsza przeglądarka internetowa?</option>
                    <option value="10">Pytanie 10: Co robisz, gdy internet zaczyna wolno działać?</option>
                    <option value="11">Pytanie 11: Jaki przedmiot szkolny sprawia informatykom najwięcej problemów?
                    </option>
                    <option value="12">Pytanie 12: Wymień znaną markę ze świata sprzętu komputerowego.</option>
                </select>
                <h3 id="displayCurrentQ" style="color: #f1c40f;">Aktywne pytanie: Brak</h3>
                <div id="answersContainer"></div>

                <h2>Zarządzanie Drużynami w tej rundzie</h2>
                <div class="team-controls-row">
                    <div class="team-box-ctrl">
                        <h4 style="margin:0 0 5px 0; color:#3498db;">PROGRAMIŚCI</h4>
                        <button class="btn btn-blue" onclick="modifyScore(1, 10)">+10 pkt</button>
                        <button class="btn btn-red" onclick="modifyScore(1, -10)">-10 pkt</button>
                        <div style="margin-top:10px;">
                            <button class="btn btn-red" style="background:#c0392b; width:100%;"
                                onclick="addStrike(1)">⚠️ DAJ BŁĄD (X)</button>
                        </div>
                        <div class="strike-indicator" id="t1-strikes-view">SZANSE: <span>X</span> <span>X</span>
                            <span>X</span>
                        </div>
                    </div>

                    <div class="team-box-ctrl red-side">
                        <h4 style="margin:0 0 5px 0; color:#e74c3c;">INFORMATYCY</h4>
                        <button class="btn btn-blue" onclick="modifyScore(2, 10)">+10 pkt</button>
                        <button class="btn btn-red" onclick="modifyScore(2, -10)">-10 pkt</button>
                        <div style="margin-top:10px;">
                            <button class="btn btn-red" style="background:#c0392b; width:100%;"
                                onclick="addStrike(2)">⚠️ DAJ BŁĄD (X)</button>
                        </div>
                        <div class="strike-indicator" id="t2-strikes-view">SZANSE: <span>X</span> <span>X</span>
                            <span>X</span>
                        </div>
                    </div>
                </div>
                <button class="btn btn-yellow" style="width:100%; margin-top:15px;" onclick="resetStrikes()">🔄 RESETUJ
                    KRZYŻYKI NA NOWĄ RUNDĘ</button>
            </div>

            <div class="card" id="panel-final" style="display:none;">
                <h2>Stoper Finałowy</h2>
                <div style="margin-bottom: 15px;">
                    <button class="btn btn-green" onclick="startTimer(20)">⏱️ START GRACZ 1 (20s)</button>
                    <button class="btn btn-green" onclick="startTimer(25)">⏱️ START GRACZ 2 (25s)</button>
                    <button class="btn btn-red" onclick="stopTimer()">🛑 ZATRZYMAJ</button>
                </div>

                <h2>Odpowiedzi Finałowe</h2>
                <div class="final-grid">
                    <div>
                        <h3 style="color:#3498db">Gracz 1</h3>
                        <div id="f-g1-rows"></div>
                    </div>
                    <div>
                        <h3 style="color:#e67e22">Gracz 2</h3>
                        <div id="f-g2-rows"></div>
                    </div>
                </div>
            </div>
        </div>

        <div>
            <div class="card">
                <h2>Oryginalny Soundboard</h2>
                <div class="soundboard">
                    <div class="sound-block">
                        <span
                            style="font-size:0.8rem; display:block; margin-bottom:5px; font-weight:bold; color:#3498db;">1.
                            Intro</span>
                        <iframe width="110" height="200"
                            src="https://www.myinstants.com/instant/przerywnik-przed-i-po-familiada-83236/embed/"
                            scrolling="no"></iframe>
                    </div>
                    <div class="sound-block">
                        <span
                            style="font-size:0.8rem; display:block; margin-bottom:5px; font-weight:bold; color:#2ecc71;">2.
                            Trafienie</span>
                        <iframe width="110" height="200"
                            src="https://www.myinstants.com/instant/dobra-odpowiedz-familiada-15351/embed/"
                            scrolling="no"></iframe>
                    </div>
                    <div class="sound-block error-zone">
                        <span
                            style="font-size:0.8rem; display:block; margin-bottom:5px; font-weight:bold; color:#ff9f91;">3.
                            Błąd (X)</span>
                        <iframe width="110" height="200"
                            src="https://www.myinstants.com/instant/bledna-familiada-78197/embed/"
                            scrolling="no"></iframe>
                    </div>
                    <div class="sound-block">
                        <span
                            style="font-size:0.8rem; display:block; margin-bottom:5px; font-weight:bold; color:#f1c40f;">4.
                            Powtórka</span>
                        <iframe width="110" height="200"
                            src="https://www.myinstants.com/instant/powtorzenie-w-finale-familiada-99989/embed/"
                            scrolling="no"></iframe>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const db = {
            1: {
                q: "Co uczniowie robią, gdy komputer się zawiesi?", a: [
                    { text: "Restartują", pts: 40 },
                    { text: "Przeglądają Instagram / Telefon", pts: 30 },
                    { text: "Klikają wszystko naraz", pts: 20 },
                    { text: "Wołają nauczyciela", pts: 20 },
                    { text: "Denerwują się", pts: 10 },
                    { text: "Czekają bezczynnie", pts: 10 }
                ]
            },
            2: {
                q: "Wymień najpopularniejsze zwierzę w IT.", a: [
                    { text: "Myszka", pts: 40 },
                    { text: "Python (Wąż)", pts: 30 },
                    { text: "Bug (Robak)", pts: 20 },
                    { text: "Pingwin (Linux)", pts: 10 },
                    { text: "Kot z memów", pts: 10 },
                    { text: "Chomik", pts: 10 }
                ]
            },
            3: {
                q: "Ile myszek jest w naszej szkole?", a: [
                    { text: "Bardzo dużo", pts: 40 },
                    { text: "Ponad 100", pts: 30 },
                    { text: "Nikt nie wie", pts: 20 },
                    { text: "Za mało", pts: 10 },
                    { text: "Tyle co uczniów", pts: 10 },
                    { text: "Jedna na komputer", pts: 10 }
                ]
            },
            4: {
                q: "Co najczęściej mówi informatyk?", a: [
                    { text: "„Zrestartuj komputer”", pts: 40 },
                    { text: "„A próbowałeś wyłączyć i włączyć?”", pts: 30 },
                    { text: "„U mnie działa”", pts: 20 },
                    { text: "„Pokaż, co kliknąłeś”", pts: 20 },
                    { text: "„To nie moja wina”", pts: 10 },
                    { text: "„To wina systemu”", pts: 10 }
                ]
            },
            5: {
                q: "Co najczęściej psuje się w komputerze?", a: [
                    { text: "System operacyjny / Windows", pts: 30 },
                    { text: "Dysk", pts: 30 },
                    { text: "Zasilacz", pts: 20 },
                    { text: "Pamięć RAM", pts: 20 },
                    { text: "Karta graficzna", pts: 10 },
                    { text: "Chłodzenie / Wentylator", pts: 10 }
                ]
            },
            6: {
                q: "Jakie słowo najczęściej słyszy nauczyciel przedmiotów zawodowych?", a: [
                    { text: "„Nie działa”", pts: 40 },
                    { text: "„Pomocy!” / „Proszę Pana”", pts: 30 },
                    { text: "„Wrzuci Pan kod na uczniowski?”", pts: 20 },
                    { text: "„Luz” / „Łatwe”", pts: 10 },
                    { text: "„Skończyłem”", pts: 10 },
                    { text: "„Co mam teraz robić?”", pts: 10 }
                ]
            },
            7: {
                q: "Co oprócz komputera znajduje się na biurku informatyka?", a: [
                    { text: "Klawiatura / Myszka", pts: 40 },
                    { text: "Puszka po energetyku / Kawa", pts: 30 },
                    { text: "Talerz / Okruchy", pts: 20 },
                    { text: "Podkładka pod mysz", pts: 10 },
                    { text: "Słuchawki", pts: 10 },
                    { text: "Telefon / Kable", pts: 10 }
                ]
            },
            8: {
                q: "Jaka jest najpopularniejsza przeglądarka internetowa?", a: [
                    { text: "Google Chrome", pts: 50 },
                    { text: "Opera / Opera GX", pts: 20 },
                    { text: "Mozilla Firefox", pts: 20 },
                    { text: "Microsoft Edge", pts: 10 },
                    { text: "Safari", pts: 10 },
                    { text: "Brave", pts: 10 }
                ]
            },
            9: {
                q: "Co robisz, gdy internet zaczyna wolno działać?", a: [
                    { text: "Resetuję router", pts: 40 },
                    { text: "Wyłączam i włączam Wi-Fi", pts: 30 },
                    { text: "Sprawdzam Speedtest", pts: 20 },
                    { text: "Denerwuję się / Przeklinam", pts: 10 },
                    { text: "Czekam aż przejdzie", pts: 10 },
                    { text: "Uderzam w biurko", pts: 10 }
                ]
            },
            10: {
                q: "Jaki przedmiot szkolny sprawia uczniom IT najwięcej problemów?", a: [
                    { text: "Matematyka", pts: 40 },
                    { text: "Fizyka", pts: 20 },
                    { text: "Przedmiot zawodowy (np. bazy)", pts: 20 },
                    { text: "Język polski", pts: 10 },
                    { text: "Język angielski", pts: 10 },
                    { text: "WF", pts: 10 }
                ]
            },
            11: {
                q: "Wymień znaną markę ze świata sprzętu komputerowego.", a: [
                    { text: "Intel / AMD", pts: 30 },
                    { text: "NVIDIA", pts: 30 },
                    { text: "ASUS / Lenovo", pts: 20 },
                    { text: "Apple", pts: 10 },
                    { text: "Be quiet! / Kingston", pts: 10 },
                    { text: "Samsung / HP", pts: 10 }
                ]
            }
        };

        let state = {
            isFinal: false, currentQuestion: "Oczekiwanie na pytanie...",
            score1: 0, score2: 0, strikesTeam1: 0, strikesTeam2: 0,
            answers: [], triggerX: false, timerRunning: false, timeLeft: 20,
            finalData: {
                g1: Array(5).fill({ text: "", pts: 0, showAns: false, showPts: false }),
                g2: Array(5).fill({ text: "", pts: 0, showAns: false, showPts: false })
            }
        };

        let timerInterval;

        function addStrike(team) {
            if (state[`strikesTeam${team}`] < 3) {
                state[`strikesTeam${team}`]++;
                state.triggerX = true;
                updateState();
                renderStrikesInPanel();
                setTimeout(() => { state.triggerX = false; updateState(); }, 100);
            }
        }

        function resetStrikes() {
            state.strikesTeam1 = 0; state.strikesTeam2 = 0;
            updateState(); renderStrikesInPanel();
        }

        function renderStrikesInPanel() {
            for (let t = 1; t <= 2; t++) {
                const spans = document.querySelectorAll(`#t${t}-strikes-view span`);
                spans.forEach((span, idx) => {
                    if (idx < state[`strikesTeam${t}`]) span.classList.add('active');
                    else span.classList.remove('active');
                });
            }
        }

        function setMode(isFinal) {
            state.isFinal = isFinal;
            document.getElementById('panel-normal').style.display = isFinal ? 'none' : 'block';
            document.getElementById('panel-final').style.display = isFinal ? 'block' : 'none';
            updateState();
        }

        function loadQuestion() {
            const id = document.getElementById('questionSelect').value;
            if (id == 0) return;
            state.currentQuestion = db[id].q;
            document.getElementById('displayCurrentQ').innerText = "Aktywne pytanie: " + db[id].q;
            state.answers = db[id].a.map(ans => ({ ...ans, revealed: false }));
            renderPanelAnswers();
            updateState();
        }

        function renderPanelAnswers() {
            const container = document.getElementById('answersContainer');
            container.innerHTML = "";
            state.answers.forEach((ans, idx) => {
                const row = document.createElement('div');
                row.className = 'ans-row';
                row.innerHTML = `
                    <span><strong>${idx + 1}.</strong> ${ans.text} (${ans.pts} pkt)</span>
                    <button class="btn btn-green" id="btn-ans-${idx}" onclick="revealAnswer(${idx})">ODSŁOŃ</button>
                `;
                container.appendChild(row);
            });
        }

        function revealAnswer(idx) {
            state.answers[idx].revealed = true;
            document.getElementById(`btn-ans-${idx}`).disabled = true;
            document.getElementById(`btn-ans-${idx}`).style.background = '#7f8c8d';
            updateState();
        }

        function modifyScore(team, val) {
            if (team === 1) state.score1 = Math.max(0, parseInt(state.score1) + val);
            if (team === 2) state.score2 = Math.max(0, parseInt(state.score2) + val);
            updateState();
        }

        function buildFinalPanel() {
            for (let g = 1; g <= 2; g++) {
                const container = document.getElementById(`f-g${g}-rows`);
                container.innerHTML = "";
                for (let p = 0; p < 5; p++) {
                    const div = document.createElement('div');
                    div.style.marginBottom = "8px";
                    div.innerHTML = `
                        <input type="text" placeholder="Odp ${p + 1}" class="f-input" id="f-text-${g}-${p}" onchange="saveFinalData()">
                        <input type="number" placeholder="Pkt" class="f-pts" id="f-pts-${g}-${p}" onchange="saveFinalData()">
                        <button class="btn btn-blue" style="padding:4px 8px; font-size:0.8rem;" onclick="revealFinalField(${g}, ${p}, 'Ans')">Odp</button>
                        <button class="btn btn-green" style="padding:4px 8px; font-size:0.8rem;" onclick="revealFinalField(${g}, ${p}, 'Pts')">Pkt</button>
                    `;
                    container.appendChild(div);
                }
            }
        }

        function saveFinalData() {
            for (let g = 1; g <= 2; g++) {
                for (let p = 0; p < 5; p++) {
                    state.finalData[`g${g}`][p] = {
                        text: document.getElementById(`f-text-${g}-${p}`).value,
                        pts: parseInt(document.getElementById(`f-pts-${g}-${p}`).value) || 0,
                        showAns: state.finalData[`g${g}`][p].showAns,
                        showPts: state.finalData[`g${g}`][p].showPts
                    };
                }
            }
            updateState();
        }

        function revealFinalField(g, p, type) {
            if (type === 'Ans') state.finalData[`g${g}`][p].showAns = true;
            if (type === 'Pts') state.finalData[`g${g}`][p].showPts = true;
            updateState();
        }

        function startTimer(seconds) {
            clearInterval(timerInterval);
            state.timerRunning = true; state.timeLeft = seconds; updateState();
            timerInterval = setInterval(() => {
                state.timeLeft--;
                if (state.timeLeft <= 0) { clearInterval(timerInterval); state.timerRunning = false; }
                updateState();
            }, 1000);
        }

        function stopTimer() { clearInterval(timerInterval); state.timerRunning = false; updateState(); }
        function updateState() { localStorage.setItem('familiada_state', JSON.stringify(state)); }

        localStorage.removeItem('familiada_state');
        buildFinalPanel(); renderStrikesInPanel();
    </script>
</body>

</html>
